<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Responsive 3D Editor (Mobile & PC)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        :root {
            --bg-main: #000000;
            --bg-panel: #1c1c1e;
            --bg-item: #2c2c2e;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --primary: #00d2d3;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; user-select: none; }
        
        body { 
            background-color: var(--bg-main); color: var(--text-main); 
            /* Dùng 100dvh để fix lỗi thanh địa chỉ trên mobile */
            height: 100vh; height: 100dvh; 
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* TOP BAR */
        .top-bar { 
            height: 56px; display: flex; justify-content: space-between; align-items: center; 
            padding: 0 16px; font-size: 20px; flex-shrink: 0; background: var(--bg-panel);
        }
        .btn-export { 
            background-color: var(--primary); color: #000; font-weight: 500; 
            padding: 8px 16px; border-radius: 4px; font-size: 14px; border: none; cursor: pointer; 
        }
        .btn-export:disabled { background: #444; color: #888; }

        /* PREVIEW AREA (Không gian 3D) */
        .preview-area { 
            flex: 1; background: #000; position: relative; 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; 
        }
        
        /* Canvas WebGL tự động co giãn */
        #canvas-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        #canvas-container canvas { max-width: 100%; max-height: 100%; object-fit: contain; }

        .empty-state { position: absolute; text-align: center; cursor: pointer; color: #888; }
        
        /* BOTTOM SHEET (Bảng điều khiển) */
        .edit-panel {
            position: absolute; bottom: -100%; left: 0; right: 0; 
            height: 45vh; /* Chiếm 45% màn hình */
            background: var(--bg-panel); border-radius: 20px 20px 0 0; z-index: 100;
            transition: bottom 0.3s cubic-bezier(0.1, 0.7, 0.1, 1); 
            display: flex; flex-direction: column;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.8); border-top: 1px solid var(--border-color);
        }
        .edit-panel.open { bottom: 0; }
        
        .panel-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 20px; border-bottom: 1px solid var(--border-color); flex-shrink: 0;
        }
        .panel-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 5px; }
        
        /* Phần nội dung cuộn được nếu màn hình nhỏ */
        .panel-content { 
            flex: 1; overflow-y: auto; padding: 20px; 
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; 
        }
        
        /* Sliders (To hơn để dễ chạm trên mobile) */
        .slider-group { display: flex; flex-direction: column; gap: 10px; }
        .slider-group.full-width { grid-column: span 2; }
        .slider-header { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); }
        .slider-header span:last-child { color: #fff; font-weight: 500; }
        
        input[type=range] { 
            -webkit-appearance: none; width: 100%; background: transparent; height: 24px; 
            touch-action: pan-y; /* Hỗ trợ vuốt mượt trên đt */
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #444; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; 
            background: #fff; margin-top: -7px; box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        /* Thanh điều hướng dưới cùng */
        .bottom-nav {
            height: 60px; background: var(--bg-panel); display: flex; align-items: center; justify-content: space-around;
            border-top: 1px solid var(--border-color); flex-shrink: 0;
        }
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; gap: 4px; 
            font-size: 10px; color: var(--text-muted); cursor: pointer; padding: 10px;
        }
        .nav-item.active { color: var(--primary); }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

        #fileInput { display: none; }

        /* Tối ưu cho màn hình máy tính (Ngang) */
        @media (min-width: 768px) {
            .edit-panel { width: 400px; left: auto; right: 20px; bottom: -100%; height: 80vh; border-radius: 15px 15px 0 0; }
            .edit-panel.open { bottom: 0; }
            .panel-content { grid-template-columns: 1fr; }
            .slider-group.full-width { grid-column: span 1; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <header class="top-bar">
        <div style="font-size: 24px; cursor: pointer;">✕</div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <div style="font-size: 14px; background: #333; padding: 4px 10px; border-radius: 4px;">AI UHD ▾</div>
            <button class="btn-export" id="btnExport" onclick="exportVideo()" disabled>Xuất</button>
        </div>
    </header>

    <main class="preview-area">
        <div class="empty-state" id="emptyState" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 40px; margin-bottom: 10px;">+</div>
            <div>Nhấn để tải Video / Ảnh lên</div>
        </div>
        <div id="canvas-container"></div>
    </main>

    <div class="edit-panel" id="editPanel">
        <div class="panel-header">
            <span style="font-weight: 500;">Chỉnh sửa 3D</span>
            <button class="panel-close" onclick="closeEditPanel()">✕</button>
        </div>
        <div class="panel-content" id="editContent" style="opacity: 0.5; pointer-events: none;">
            <div class="slider-group">
                <div class="slider-header"><span>Kích thước</span><span id="valScale">1.0x</span></div>
                <input type="range" id="inputScale" min="0.5" max="2.5" step="0.1" value="1">
            </div>
            <div class="slider-group">
                <div class="slider-header"><span>Xoay 2D</span><span id="valRot2D">0°</span></div>
                <input type="range" id="inputRot2D" min="-180" max="180" value="0">
            </div>
            <div class="slider-group">
                <div class="slider-header"><span>Xoay 3D (Y)</span><span id="valRot3DY">0°</span></div>
                <input type="range" id="inputRot3DY" min="-180" max="180" value="0">
            </div>
            <div class="slider-group">
                <div class="slider-header"><span>Xoay 3D (X)</span><span id="valRot3DX">0°</span></div>
                <input type="range" id="inputRot3DX" min="-180" max="180" value="0">
            </div>
            <div class="slider-group full-width">
                <div class="slider-header"><span>Đồ thị</span></div>
                <select id="selectGraph" style="padding: 10px; background: #333; color: white; border: 1px solid #444; border-radius: 5px; font-size: 14px;">
                    <option value="linear">Đều (Linear)</option>
                    <option value="easeOut">Hình khối phóng ra (Ease-out)</option>
                    <option value="easeInOut">Hình khối chữ S (S-Curve)</option>
                </select>
            </div>
            <div class="slider-group full-width" style="flex-direction: row; gap: 10px; margin-top: 10px;">
                <button class="btn-export" style="flex:1; padding: 12px; background:#444; color:#fff;" onclick="playAnimation()">▶ CHẠY THỬ</button>
                <button class="btn-export" style="flex:1; padding: 12px; background:#ff3b30; color:#fff;" onclick="removeLayer()">XÓA</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="openEditPanel()">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            <span>Chỉnh sửa</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            <span>Âm thanh</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M5 4v3h5.5v12h3V7H19V4z"/></svg>
            <span>Văn bản</span>
        </div>
    </nav>

    <input type="file" id="fileInput" accept="video/*,image/*">

    <script>
        // --- 1. KHỞI TẠO WEBGL (THREE.JS) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
        // Kích thước render cố định để xuất video nét, nhưng CSS sẽ thu nhỏ lại cho vừa màn hình
        renderer.setSize(720, 720); 
        container.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(4, 4); 
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
        const plane = new THREE.Mesh(geometry, material);
        scene.add(plane);

        let isVideoLoaded = false;
        let mediaElement = null;
        let texture = null;
        
        const inputs = {
            scale: document.getElementById('inputScale'),
            rot2D: document.getElementById('inputRot2D'),
            rot3DY: document.getElementById('inputRot3DY'),
            rot3DX: document.getElementById('inputRot3DX'),
            graph: document.getElementById('selectGraph')
        };

        // --- 2. TẢI FILE LÊN ---
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            
            if (mediaElement) {
                if(mediaElement.pause) mediaElement.pause();
                mediaElement.src = "";
            }

            if (file.type.startsWith('video/')) {
                mediaElement = document.createElement('video');
                mediaElement.src = url;
                mediaElement.crossOrigin = 'anonymous';
                mediaElement.loop = true;
                mediaElement.muted = true;
                mediaElement.play();
                isVideoLoaded = true;
            } else if (file.type.startsWith('image/')) {
                mediaElement = new Image();
                mediaElement.src = url;
                isVideoLoaded = true;
            }

            mediaElement.onloadeddata = () => {
                if(texture) texture.dispose();
                texture = new THREE.Texture(mediaElement);
                texture.needsUpdate = true;
                
                material.map = texture;
                material.needsUpdate = true;

                const aspect = (mediaElement.videoWidth || mediaElement.width) / (mediaElement.videoHeight || mediaElement.height);
                
                // Xử lý tỷ lệ để ảnh không bị méo
                camera.aspect = aspect;
                camera.updateProjectionMatrix();
                
                // Điều chỉnh kích thước renderer theo tỷ lệ ảnh
                renderer.setSize(720, 720 / aspect);

                // Reset góc xoay
                plane.rotation.set(0, 0, 0);
                inputs.scale.value = 1;
                inputs.rot2D.value = 0;
                inputs.rot3DY.value = 0;
                inputs.rot3DX.value = 0;
                applyTransform();

                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('btnExport').disabled = false;
                document.getElementById('editContent').style.opacity = '1';
                document.getElementById('editContent').style.pointerEvents = 'auto';
            };
            fileInput.value = '';
        });

        // --- 3. RENDER LOOP ---
        function renderLoop() {
            requestAnimationFrame(renderLoop);
            if (isVideoLoaded && texture && mediaElement.readyState >= 2) {
                texture.needsUpdate = true; 
            }
            renderer.render(scene, camera);
        }
        renderLoop();

        // --- 4. ÁP DỤNG THÔNG SỐ ---
        function applyTransform() {
            if(!mediaElement) return;

            const s = parseFloat(inputs.scale.value);
            const r2d = parseFloat(inputs.rot2D.value);
            const rY = parseFloat(inputs.rot3DY.value);
            const rX = parseFloat(inputs.rot3DX.value);

            document.getElementById('valScale').innerText = s.toFixed(1) + 'x';
            document.getElementById('valRot2D').innerText = r2d + '°';
            document.getElementById('valRot3DY').innerText = rY + '°';
            document.getElementById('valRot3DX').innerText = rX + '°';

            const rad2D = (r2d * Math.PI) / 180;
            const radY = (rY * Math.PI) / 180;
            const radX = (rX * Math.PI) / 180;

            const aspect = mediaElement.videoWidth ? mediaElement.videoWidth / mediaElement.videoHeight : 1;
            
            // Áp dụng Scale (Giữ nguyên tỷ lệ)
            plane.scale.set(aspect * s, s, 1);
            
            // Áp dụng xoay
            plane.rotation.y = radY; 
            plane.rotation.x = radX;
            plane.rotation.z = rad2D; 
        }

        Object.keys(inputs).forEach(key => {
            inputs[key].addEventListener('input', applyTransform);
        });

        // --- 5. ĐỒ THỊ VÀ ANIMATION ---
        function getEasedProgress(p, type) {
            if (type === 'linear') return p;
            if (type === 'easeOut') return 1 - Math.pow(1 - p, 3);
            if (type === 'easeInOut') return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; 
            return p;
        }

        function playAnimation() {
            if (!isVideoLoaded) return;
            const graphType = inputs.graph.value;
            const duration = 3000; 
            const startTime = performance.now();
            
            function animateStep(currentTime) {
                let progress = Math.min((currentTime - startTime) / duration, 1);
                let eased = getEasedProgress(progress, graphType);
                
                inputs.rot3DY.value = eased * 360;
                applyTransform();

                if (progress < 1) requestAnimationFrame(animateStep);
            }
            requestAnimationFrame(animateStep);
        }

        // --- 6. XUẤT VIDEO ---
        function exportVideo() {
            if (!isVideoLoaded) return;
            const btn = document.getElementById('btnExport');
            btn.innerText = "Rendering...";
            btn.disabled = true;

            if (mediaElement.tagName === 'VIDEO') mediaElement.currentTime = 0;

            const stream = renderer.domElement.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
            const chunks = [];

            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = '3d_export.webm'; a.click();
                btn.innerText = "Xuất"; btn.disabled = false;
            };

            recorder.start();

            const duration = 3000;
            const startTime = performance.now();
            const graphType = inputs.graph.value;

            function exportStep(currentTime) {
                let progress = Math.min((currentTime - startTime) / duration, 1);
                let eased = getEasedProgress(progress, graphType);
                
                inputs.rot3DY.value = eased * 360;
                applyTransform(); 

                if (progress < 1) {
                    requestAnimationFrame(exportStep);
                } else {
                    recorder.stop();
                }
            }
            requestAnimationFrame(exportStep);
        }

        // UI Helpers
        function openEditPanel() { 
            if(!isVideoLoaded) return;
            document.getElementById('editPanel').classList.add('open'); 
        }
        function closeEditPanel() { document.getElementById('editPanel').classList.remove('open'); }
        function removeLayer() { 
            plane.visible = false; 
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('btnExport').disabled = true;
            closeEditPanel();
        }
    </script>
</body>
</html>
