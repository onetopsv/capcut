<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini CapCut Web Clone</title>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --primary: #00d2d3; --border: #333; }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; margin: 0; height: 100vh; overflow: hidden; }
        
        /* --- KHU VỰC PREVIEW --- */
        .preview-area { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; position: relative; overflow: hidden; }
        #mainCanvas { box-shadow: 0 0 20px rgba(0,0,0,0.8); background: #222; }
        
        /* Nút bấm nổi trên Preview */
        .preview-controls { position: absolute; bottom: 20px; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; background: var(--primary); color: #000; }
        .btn:disabled { background: #555; color: #888; cursor: not-allowed; }
        .btn-upload { background: #444; color: white; }

        /* --- KHU VỰC ĐIỀU KHIỂN DƯỚI CÙNG --- */
        .bottom-panel { height: 350px; background: var(--panel); display: flex; border-top: 1px solid var(--border); }
        
        /* Panel Trái: Danh sách Layers */
        .layers-list { width: 250px; border-right: 1px solid var(--border); overflow-y: auto; padding: 10px; }
        .layer-item { padding: 10px; background: #2a2a2a; margin-bottom: 5px; border-radius: 5px; cursor: pointer; border: 2px solid transparent; display: flex; justify-content: space-between; }
        .layer-item.active { border-color: var(--primary); background: #333; }
        .layer-item span { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
        
        /* Panel Phải: Công cụ chỉnh sửa */
        .edit-tools { flex: 1; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; overflow-y: auto; }
        .tool-group { display: flex; flex-direction: column; gap: 5px; }
        .tool-group label { font-size: 12px; color: #aaa; display: flex; justify-content: space-between; }
        input[type=range] { width: 100%; cursor: pointer; }
        select { padding: 8px; background: #333; color: white; border: 1px solid var(--border); border-radius: 5px; margin-top: 5px; }
        
        /* Timeline Giả lập (Chỉ hiển thị) */
        .timeline-bar { height: 50px; background: #222; border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

    <!-- KHU VỰC PREVIEW VIDEO -->
    <div class="preview-area">
        <canvas id="mainCanvas" width="720" height="720"></canvas>
        
        <div class="preview-controls">
            <label class="btn btn-upload">
                + Tải File Lên (Video/Ảnh/Âm thanh)
                <input type="file" id="fileInput" multiple accept="video/*,image/*,audio/*" style="display: none;">
            </label>
            <button class="btn" id="btnExport" onclick="exportVideo()" disabled>XUẤT VIDEO</button>
        </div>
    </div>

    <!-- BẢNG ĐIỀU KHIỂN -->
    <div class="bottom-panel">
        <!-- Danh sách các lớp -->
        <div class="layers-list" id="layersList">
            <div style="font-size: 12px; color: #888; margin-bottom: 10px;">DANH SÁCH LỚP</div>
            <!-- Các layer sẽ được thêm vào đây bằng JS -->
        </div>

        <!-- Công cụ chỉnh sửa chi tiết -->
        <div class="edit-tools" id="editTools" style="opacity: 0.5; pointer-events: none;">
            <div class="tool-group">
                <label>Kích thước (Scale) <span id="valScale">1.0x</span></label>
                <input type="range" id="inputScale" min="0.1" max="3" step="0.1" value="1">
            </div>
            <div class="tool-group">
                <label>Xoay 2D (Rotate) <span id="valRot2D">0°</span></label>
                <input type="range" id="inputRot2D" min="-180" max="180" value="0">
            </div>
            <div class="tool-group">
                <label>Xoay 3D Trục Y <span id="valRot3DY">0°</span></label>
                <input type="range" id="inputRot3DY" min="-180" max="180" value="0">
            </div>
            <div class="tool-group">
                <label>Xoay 3D Trục X <span id="valRot3DX">0°</span></label>
                <input type="range" id="inputRot3DX" min="-180" max="180" value="0">
            </div>
            <div class="tool-group">
                <label>Vị trí X <span id="valPosX">0</span></label>
                <input type="range" id="inputPosX" min="-300" max="300" value="0">
            </div>
            <div class="tool-group">
                <label>Vị trí Y <span id="valPosY">0</span></label>
                <input type="range" id="inputPosY" min="-300" max="300" value="0">
            </div>
            
            <div class="tool-group" style="grid-column: span 2; border-top: 1px solid #444; padding-top: 10px;">
                <label>Chọn Đồ Thị Chuyển Động</label>
                <select id="selectGraph">
                    <option value="linear">Đều (Linear)</option>
                    <option value="easeOut">Hình khối phóng ra (Ease-out)</option>
                    <option value="easeInOut">Hình khối chữ S (S-Curve)</option>
                </select>
            </div>
            
            <div class="tool-group" style="grid-column: span 2; display: flex; gap: 10px;">
                <button class="btn" style="flex:1;" onclick="playAnimation()">▶ CHẠY HIỆU ỨNG</button>
                <button class="btn" style="flex:1; background:#444; color:white;" onclick="removeLayer()">XÓA LỚP NÀY</button>
            </div>
        </div>
    </div>

    <!-- Thanh Timeline Giả lập -->
    <div class="timeline-bar">
        <span>00:00:00 / 00:00:03</span>
        <div style="flex:1; height: 20px; background: #333; margin-left: 20px; border-radius: 5px; position: relative;">
            <div id="playhead" style="position: absolute; width: 2px; height: 100%; background: var(--primary); left: 0%;"></div>
        </div>
    </div>

    <script>
        // --- KHỞI TẠO HỆ THỐNG ---
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('fileInput');
        
        let layers = []; // Mảng chứa tất cả các lớp (ảnh, video, âm thanh)
        let activeLayerId = null;
        let isPlaying = false;

        // Các thẻ input điều khiển
        const inputs = {
            scale: document.getElementById('inputScale'),
            rot2D: document.getElementById('inputRot2D'),
            rot3DY: document.getElementById('inputRot3DY'),
            rot3DX: document.getElementById('inputRot3DX'),
            posX: document.getElementById('inputPosX'),
            posY: document.getElementById('inputPosY'),
            graph: document.getElementById('selectGraph')
        };

        // --- 1. XỬ LÝ TẢI FILE LÊN ---
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            
            files.forEach(file => {
                const url = URL.createObjectURL(file);
                const id = Date.now() + Math.random().toString(36).substr(2, 5);
                
                let type = 'image';
                let element = null;

                if (file.type.startsWith('video/')) {
                    type = 'video';
                    element = document.createElement('video');
                    element.src = url;
                    element.crossOrigin = 'anonymous';
                    element.loop = true;
                    element.muted = true; // Tắt tiếng video gốc để tránh lỗi
                    element.play();
                } else if (file.type.startsWith('image/')) {
                    type = 'image';
                    element = new Image();
                    element.src = url;
                } else if (file.type.startsWith('audio/')) {
                    type = 'audio';
                    element = new Audio(url);
                    element.loop = true;
                    element.play();
                }

                // Tạo đối tượng Layer mới
                const newLayer = {
                    id: id,
                    name: file.name,
                    type: type,
                    element: element,
                    // Thuộc tính hiển thị
                    scale: 1,
                    rot2D: 0,
                    rot3DY: 0,
                    rot3DX: 0,
                    x: 0,
                    y: 0,
                    graph: 'linear'
                };

                // Chỉ thêm vào mảng hiển thị nếu là ảnh hoặc video
                if (type !== 'audio') {
                    layers.push(newLayer);
                    renderLayersList();
                    selectLayer(id); // Tự động chọn layer vừa thêm
                    document.getElementById('btnExport').disabled = false;
                } else {
                    // Nếu là audio, chỉ phát ngầm (Demo)
                    element.play();
                    alert(`Đã thêm âm thanh: ${file.name}. (Chỉ phát ngầm khi chạy)`);
                }
            });
            fileInput.value = ''; // Reset input
        });

        // --- 2. QUẢN LÝ DANH SÁCH LỚP ---
        function renderLayersList() {
            const list = document.getElementById('layersList');
            // Xóa các item cũ, giữ lại tiêu đề
            list.innerHTML = '<div style="font-size: 12px; color: #888; margin-bottom: 10px;">DANH SÁCH LỚP</div>';
            
            // Duyệt ngược để lớp mới nhất hiện lên trên cùng
            [...layers].reverse().forEach(layer => {
                const div = document.createElement('div');
                div.className = `layer-item ${layer.id === activeLayerId ? 'active' : ''}`;
                div.onclick = () => selectLayer(layer.id);
                div.innerHTML = `
                    <span>${layer.type === 'video' ? '🎬' : '🖼️'} ${layer.name}</span>
                `;
                list.appendChild(div);
            });
        }

        function selectLayer(id) {
            activeLayerId = id;
            renderLayersList();
            
            const layer = layers.find(l => l.id === id);
            if (!layer) return;

            // Bật bảng điều khiển
            document.getElementById('editTools').style.opacity = '1';
            document.getElementById('editTools').style.pointerEvents = 'auto';

            // Cập nhật giá trị thanh trượt theo lớp đang chọn
            inputs.scale.value = layer.scale;
            inputs.rot2D.value = layer.rot2D;
            inputs.rot3DY.value = layer.rot3DY;
            inputs.rot3DX.value = layer.rot3DX;
            inputs.posX.value = layer.x;
            inputs.posY.value = layer.y;
            inputs.graph.value = layer.graph;
            
            updateLabels();
        }

        function removeLayer() {
            if (!activeLayerId) return;
            layers = layers.filter(l => l.id !== activeLayerId);
            activeLayerId = null;
            renderLayersList();
            
            document.getElementById('editTools').style.opacity = '0.5';
            document.getElementById('editTools').style.pointerEvents = 'none';
            if(layers.length === 0) document.getElementById('btnExport').disabled = true;
            drawFrame(); // Xóa hình ảnh trên canvas
        }

        // --- 3. LẮNG NGHE THAY ĐỔI THÔNG SỐ ---
        Object.keys(inputs).forEach(key => {
            inputs[key].addEventListener('input', () => {
                if (!activeLayerId) return;
                const layer = layers.find(l => l.id === activeLayerId);
                if (!layer) return;

                // Cập nhật dữ liệu
                if (key === 'scale') layer.scale = parseFloat(inputs.scale.value);
                if (key === 'rot2D') layer.rot2D = parseFloat(inputs.rot2D.value);
                if (key === 'rot3DY') layer.rot3DY = parseFloat(inputs.rot3DY.value);
                if (key === 'rot3DX') layer.rot3DX = parseFloat(inputs.rot3DX.value);
                if (key === 'posX') layer.x = parseFloat(inputs.posX.value);
                if (key === 'posY') layer.y = parseFloat(inputs.posY.value);
                if (key === 'graph') layer.graph = inputs.graph.value;

                updateLabels();
            });
        });

        function updateLabels() {
            document.getElementById('valScale').innerText = inputs.scale.value + 'x';
            document.getElementById('valRot2D').innerText = inputs.rot2D.value + '°';
            document.getElementById('valRot3DY').innerText = inputs.rot3DY.value + '°';
            document.getElementById('valRot3DX').innerText = inputs.rot3DX.value + '°';
            document.getElementById('valPosX').innerText = inputs.posX.value;
            document.getElementById('valPosY').innerText = inputs.posY.value;
        }

        // --- 4. VÒNG LẶP VẼ (RENDER LOOP) ---
        function drawFrame() {
            // Xóa canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Vẽ từng lớp (từ dưới lên trên)
            layers.forEach(layer => {
                const el = layer.element;
                // Bỏ qua nếu ảnh chưa load xong, video chưa có dữ liệu
                if ((layer.type === 'image' && !el.complete) || (layer.type === 'video' && el.readyState < 2)) return;

                ctx.save();
                
                // Đưa gốc tọa độ về giữa canvas
                ctx.translate(canvas.width / 2 + layer.x, canvas.height / 2 + layer.y);

                // Áp dụng CSS 3D giả lập (Bằng cách scale trục X hoặc Y dựa trên góc xoay)
                // Lưu ý: Canvas 2D không có 3D thực sự, đây là mẹo vẽ (Fake 3D)
                let fakeScaleX = 1, fakeScaleY = 1;
                
                // Giả lập xoay trục Y (Trái/Phải)
                let radY = (layer.rot3DY * Math.PI) / 180;
                fakeScaleX = Math.cos(radY); // Bóp méo chiều ngang
                
                // Giả lập xoay trục X (Trên/Dưới)
                let radX = (layer.rot3DX * Math.PI) / 180;
                fakeScaleY = Math.cos(radX); // Bóp méo chiều dọc

                // Áp dụng Xoay 2D
                ctx.rotate((layer.rot2D * Math.PI) / 180);
                
                // Áp dụng Scale tổng hợp
                ctx.scale(layer.scale * fakeScaleX, layer.scale * fakeScaleY);

                // Vẽ đối tượng vào giữa (Tâm là 0,0)
                const w = el.videoWidth || el.width || 400;
                const h = el.videoHeight || el.height || 400;
                
                // Tự động thu nhỏ nếu kích thước quá lớn so với canvas
                const maxSize = 600;
                let drawW = w, drawH = h;
                if (w > maxSize || h > maxSize) {
                    const ratio = Math.min(maxSize / w, maxSize / h);
                    drawW = w * ratio;
                    drawH = h * ratio;
                }

                ctx.drawImage(el, -drawW / 2, -drawH / 2, drawW, drawH);
                
                ctx.restore();
            });

            requestAnimationFrame(drawFrame);
        }
        drawFrame(); // Bắt đầu vẽ liên tục

        // --- 5. HÀM TOÁN HỌC ĐỒ THỊ (EASING) ---
        function getEasedProgress(p, type) {
            if (type === 'linear') return p;
            if (type === 'easeOut') return 1 - Math.pow(1 - p, 3); // Phóng ra
            if (type === 'easeInOut') {
                return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; // Chữ S
            }
            return p;
        }

        // --- 6. CHẠY ANIMATION XOAY 360 ĐỘ THEO ĐỒ THỊ ---
        let isAnimating = false;
        function playAnimation() {
            if (!activeLayerId || isAnimating) return;
            const layer = layers.find(l => l.id === activeLayerId);
            
            isAnimating = true;
            const duration = 3000; // 3 giây
            const startTime = performance.now();
            const startRot = layer.rot3DY; // Xoay từ góc hiện tại
            const targetRot = startRot + 360; // Xoay thêm 360 độ

            // Chạy thanh playhead
            const playhead = document.getElementById('playhead');
            playhead.style.transition = 'none';
            playhead.style.left = '0%';
            
            function animateStep(currentTime) {
                let elapsed = currentTime - startTime;
                let progress = Math.min(elapsed / duration, 1);
                
                // Cập nhật thanh playhead
                playhead.style.left = (progress * 100) + '%';

                // Tính toán góc xoay dựa trên đồ thị
                let easedProgress = getEasedProgress(progress, layer.graph);
                layer.rot3DY = startRot + (easedProgress * 360); // 360 độ

                // Cập nhật UI thanh trượt
                inputs.rot3DY.value = layer.rot3DY % 360;
                document.getElementById('valRot3DY').innerText = Math.round(layer.rot3DY % 360) + '°';

                if (progress < 1) {
                    requestAnimationFrame(animateStep);
                } else {
                    isAnimating = false;
                    layer.rot3DY = targetRot % 360; // Chuẩn hóa góc
                    // Reset playhead
                    setTimeout(() => playhead.style.left = '0%', 500);
                }
            }
            requestAnimationFrame(animateStep);
        }

        // --- 7. XUẤT VIDEO (EXPORT) ---
        function exportVideo() {
            if (layers.length === 0) return;
            
            const btn = document.getElementById('btnExport');
            btn.innerText = "Đang Render...";
            btn.disabled = true;

            // Đảm bảo video chạy từ đầu
            layers.forEach(l => {
                if(l.type === 'video') l.element.currentTime = 0;
            });

            const stream = canvas.captureStream(30); // 30 FPS
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];

            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'mini_capcut_export.webm';
                a.click();
                
                btn.innerText = "XUẤT VIDEO";
                btn.disabled = false;
            };

            recorder.start();

            // Chạy hiệu ứng cho tất cả các lớp (Demo 3 giây)
            const duration = 3000;
            const startTime = performance.now();
            
            // Lưu lại trạng thái ban đầu
            const initialStates = layers.map(l => ({ id: l.id, rot3DY: l.rot3DY }));

            function renderExportStep(currentTime) {
                let progress = Math.min((currentTime - startTime) / duration, 1);
                
                layers.forEach(layer => {
                    const initState = initialStates.find(s => s.id === layer.id);
                    if (initState) {
                        let eased = getEasedProgress(progress, layer.graph);
                        layer.rot3DY = initState.rot3DY + (eased * 360);
                    }
                });

                if (progress < 1) {
                    requestAnimationFrame(renderExportStep);
                } else {
                    recorder.stop();
                    // Khôi phục trạng thái
                    initialStates.forEach(state => {
                        const l = layers.find(l => l.id === state.id);
                        if (l) l.rot3DY = state.rot3DY;
                    });
                }
            }
            requestAnimationFrame(renderExportStep);
        }
    </script>
</body>
</html>
