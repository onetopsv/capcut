<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Editor - Xuất Video</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; overflow-x: hidden; }
        
        /* KHU VỰC PREVIEW */
        .scene { width: 300px; height: 300px; perspective: 1000px; margin-top: 30px; margin-bottom: 20px; position: relative; }
        .card {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            border: 2px solid #00d2d3; box-sizing: border-box;
            transform: scale(1) rotate(0deg); /* Lúc hiển thị dùng CSS cho mượt */
        }
        .card video { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* BẢNG ĐIỀU KHIỂN */
        .controls-panel { width: 100%; max-width: 400px; background: #1e1e1e; padding: 20px; border-radius: 15px; display: flex; flex-direction: column; gap: 15px; }
        .slider-group { display: flex; flex-direction: column; gap: 5px; }
        .slider-header { display: flex; justify-content: space-between; font-size: 14px; color: #ddd; }
        input[type=range] { width: 100%; cursor: pointer; }
        
        /* NÚT XUẤT VIDEO */
        .btn-export { 
            background: #00d2d3; color: black; border: none; padding: 15px; 
            border-radius: 8px; font-weight: bold; font-size: 16px; 
            cursor: pointer; margin-top: 10px;
        }
        .btn-export:disabled { background: #555; color: #888; cursor: not-allowed; }
        
        /* Thẻ canvas ẩn dùng để render video */
        #hiddenCanvas { display: none; }
    </style>
</head>
<body>

    <!-- KHU VỰC VIDEO HIỂN THỊ -->
    <div class="scene">
        <div class="card" id="videoCard">
            <video id="myVideo" src="https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4" autoplay loop muted playsinline crossorigin="anonymous"></video>
        </div>
    </div>

    <!-- BẢNG ĐIỀU KHIỂN -->
    <div class="controls-panel">
        <div class="slider-group">
            <div class="slider-header"><span>Kích thước</span><span id="val-scale">100%</span></div>
            <input type="range" id="slider-scale" min="10" max="200" value="100">
        </div>
        <div class="slider-group">
            <div class="slider-header"><span>Xoay 2D</span><span id="val-rotate2d">0°</span></div>
            <input type="range" id="slider-rotate2d" min="-180" max="180" value="0">
        </div>
        
        <!-- Nút Xuất Video -->
        <button class="btn-export" id="btn-export" onclick="startExport()">XUẤT VIDEO (Tải xuống)</button>
        <div id="status-text" style="text-align: center; font-size: 13px; color: #00d2d3;"></div>
    </div>

    <!-- CANVAS ẨN (Dùng để vẽ và ghi hình) -->
    <canvas id="hiddenCanvas" width="720" height="720"></canvas>

    <script>
        const video = document.getElementById('myVideo');
        const videoCard = document.getElementById('videoCard');
        const canvas = document.getElementById('hiddenCanvas');
        const ctx = canvas.getContext('2d');
        
        const scaleSlider = document.getElementById('slider-scale');
        const rotateSlider = document.getElementById('slider-rotate2d');
        const valScale = document.getElementById('val-scale');
        const valRotate2D = document.getElementById('val-rotate2d');
        
        const btnExport = document.getElementById('btn-export');
        const statusText = document.getElementById('status-text');

        // 1. Cập nhật hiệu ứng lên màn hình (CSS)
        function updateUI() {
            const s = scaleSlider.value / 100;
            const r = rotateSlider.value;
            valScale.innerText = `${scaleSlider.value}%`;
            valRotate2D.innerText = `${r}°`;
            videoCard.style.transform = `scale(${s}) rotate(${r}deg)`;
        }
        scaleSlider.addEventListener('input', updateUI);
        rotateSlider.addEventListener('input', updateUI);

        // 2. HÀM XUẤT VIDEO
        let mediaRecorder;
        let recordedChunks = [];

        function startExport() {
            // Tạm dừng video đang chạy trên màn hình để reset về đầu
            video.pause();
            video.currentTime = 0;
            
            btnExport.disabled = true;
            statusText.innerText = "Đang chuẩn bị xuất video...";
            
            // Lấy cấu hình từ thanh trượt
            const scaleVal = scaleSlider.value / 100;
            const rotateVal = (rotateSlider.value * Math.PI) / 180; // Đổi độ sang Radian cho Canvas

            // Cấu hình MediaRecorder
            const stream = canvas.captureStream(30); // 30 FPS
            const options = { mimeType: 'video/webm; codecs=vp9' };
            
            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                // Fallback cho các trình duyệt không hỗ trợ vp9
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            }

            mediaRecorder.ondataavailable = function(e) {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = function() {
                // Khi ghi xong, tạo file và tải xuống
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'video_da_chinh_sua.webm';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                
                // Reset trạng thái
                recordedChunks = [];
                btnExport.disabled = false;
                statusText.innerText = "Xuất thành công! Đã tải về máy.";
                video.loop = true;
                video.play(); // Chạy lại video trên màn hình
            };

            // Bắt đầu ghi
            mediaRecorder.start();
            video.loop = false; // Tắt loop để nó dừng đúng lúc video kết thúc
            video.play();
            statusText.innerText = "Đang render video... Vui lòng đợi.";

            // HÀM VẼ VIDEO LÊN CANVAS LIÊN TỤC
            function drawFrame() {
                if (video.paused || video.ended) {
                    mediaRecorder.stop(); // Dừng ghi khi video hết
                    return;
                }

                // Xóa canvas trước khi vẽ frame mới
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Lưu trạng thái canvas
                ctx.save();
                
                // Di chuyển tâm canvas ra giữa
                ctx.translate(canvas.width / 2, canvas.height / 2);
                
                // Áp dụng Xoay (Rotate) và Phóng to (Scale)
                ctx.rotate(rotateVal);
                ctx.scale(scaleVal, scaleVal);

                // Tính toán kích thước để video vừa khít canvas (tương tự object-fit: cover)
                // Ở đây video gốc đang vuông 1:1 nên ta vẽ vừa khung
                const drawWidth = canvas.width;
                const drawHeight = canvas.height;
                
                // Vẽ video lên canvas (đặt tâm ở giữa)
                ctx.drawImage(video, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
                
                // Khôi phục trạng thái
                ctx.restore();

                // Gọi lại hàm này ở frame tiếp theo
                requestAnimationFrame(drawFrame);
            }

            // Bắt đầu vẽ
            requestAnimationFrame(drawFrame);
        }
    </script>
</body>
</html>
