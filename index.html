<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CapCut Web Clone</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        :root {
            --bg-main: #000000;
            --bg-panel: #1c1c1e;
            --bg-item: #2c2c2e;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --primary: #00d2d3;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; user-select: none; }
        
        body { 
            background-color: var(--bg-main); color: var(--text-main); 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- 1. TOP BAR --- */
        .top-bar {
            height: 56px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 16px; font-size: 20px; flex-shrink: 0;
        }
        .top-bar-left, .top-bar-right { display: flex; align-items: center; gap: 15px; }
        .btn-export {
            background-color: var(--primary); color: #000; font-weight: 500;
            padding: 6px 16px; border-radius: 4px; font-size: 14px; border: none; cursor: pointer;
        }
        .premium-btn {
            background: #2c2c2e; padding: 4px 10px; border-radius: 15px; font-size: 13px;
            display: flex; align-items: center; gap: 5px; color: #fff;
        }

        /* --- 2. PREVIEW AREA --- */
        .preview-area {
            flex: 1; background: #000; position: relative; display: flex; justify-content: center; align-items: center;
            overflow: hidden; padding: 10px;
        }
        #mainCanvas {
            max-width: 100%; max-height: 100%; background: #111; border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .preview-controls {
            position: absolute; bottom: 10px; left: 0; right: 0;
            display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none;
        }
        .preview-controls > div { display: flex; gap: 20px; pointer-events: auto; font-size: 24px; color: #fff; }
        .play-btn { font-size: 30px; }

        /* --- 3. TIMELINE --- */
        .timeline-container {
            height: 220px; background: var(--bg-panel); display: flex; flex-direction: column; flex-shrink: 0;
            position: relative; border-top: 1px solid var(--border-color);
        }
        .time-indicator {
            display: flex; justify-content: space-between; padding: 10px 16px; font-size: 12px; color: var(--text-muted);
        }
        
        /* Thanh cuộn ngang chứa các track */
        .timeline-tracks-wrapper {
            flex: 1; overflow-x: auto; overflow-y: hidden; position: relative; padding-left: 80px;
        }
        
        /* Vạch trắng Playhead */
        .playhead {
            position: absolute; top: 0; bottom: 0; width: 2px; background: #fff;
            left: 50%; z-index: 10; pointer-events: none;
        }
        .playhead::before {
            content: ''; position: absolute; top: 0; left: -4px; border-left: 5px solid transparent;
            border-right: 5px solid transparent; border-top: 6px solid #fff;
        }

        /* Các nút bên trái timeline (Cắt AI, Ảnh bìa) */
        .timeline-left-tools {
            position: absolute; left: 0; top: 40px; width: 70px; display: flex; flex-direction: column; gap: 10px; z-index: 5;
            background: var(--bg-panel); padding: 5px;
        }
        .tool-icon-btn {
            width: 60px; height: 60px; background: var(--bg-item); border-radius: 8px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 10px; color: var(--text-muted); text-align: center; line-height: 1.2;
        }

        /* Các Track */
        .track-row {
            height: 40px; margin-bottom: 8px; display: flex; align-items: center; position: relative;
        }
        .track-block {
            background: #2c2c2e; height: 100%; border-radius: 4px; display: flex; align-items: center;
            padding: 0 10px; font-size: 13px; color: #ccc; min-width: 150px;
        }
        .track-block.video-active { background: #3b3b4f; color: #fff; border: 1px solid #5d5d8a; }
        .track-block.audio { background: #3b2f4f; color: #fff; }

        /* --- 4. BOTTOM NAVIGATION --- */
        .bottom-nav {
            height: 70px; background: var(--bg-panel); display: flex; align-items: center;
            padding: 0 10px; overflow-x: auto; border-top: 1px solid var(--border-color); flex-shrink: 0;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            min-width: 70px; font-size: 11px; color: var(--text-muted); cursor: pointer;
        }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; }

        /* --- 5. EDIT PANEL (BOTTOM SHEET) --- */
        .edit-panel {
            position: absolute; bottom: -100%; left: 0; right: 0; height: 300px;
            background: var(--bg-panel); border-radius: 15px 15px 0 0; z-index: 100;
            transition: bottom 0.3s ease-in-out; display: flex; flex-direction: column;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5); border-top: 1px solid var(--border-color);
        }
        .edit-panel.open { bottom: 0; }
        
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; border-bottom: 1px solid var(--border-color);
        }
        .panel-title { font-weight: 500; font-size: 16px; }
        .panel-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }

        .panel-content {
            flex: 1; overflow-y: auto; padding: 15px; display: grid;
            grid-template-columns: 1fr 1fr; gap: 15px;
        }
        
        /* Sliders */
        .slider-group { display: flex; flex-direction: column; gap: 8px; }
        .slider-group.full-width { grid-column: span 2; }
        .slider-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }
        .slider-header span:last-child { color: #fff; }
        
        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent; height: 20px;
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #444; border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #fff; margin-top: -6px; box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        /* Nút Upload Ẩn */
        #fileInput { display: none; }
    </style>
</head>
<body>

    <!-- 1. TOP BAR -->
    <header class="top-bar">
        <div class="top-bar-left">
            <span style="font-size: 24px; cursor: pointer;">✕</span>
            <span style="font-size: 20px; cursor: pointer;">🔍</span>
        </div>
        <div class="top-bar-right">
            <div class="premium-btn">💎 Giá 89%</div>
            <div style="font-size: 14px; font-weight: 500; background: #333; padding: 4px 10px; border-radius: 4px;">AI UHD ▾</div>
            <button class="btn-export" id="btnExport" onclick="exportVideo()" disabled>Xuất</button>
        </div>
    </header>

    <!-- 2. PREVIEW AREA -->
    <main class="preview-area">
        <!-- Nút Upload được giả lập bằng cách click vào vùng trống nếu chưa có video -->
        <div id="emptyState" style="position: absolute; text-align: center; cursor: pointer;" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 40px; margin-bottom: 10px;">+</div>
            <div style="color: #888;">Nhấn để tải Video / Ảnh lên</div>
        </div>

        <canvas id="mainCanvas" width="720" height="720"></canvas>
        
        <!-- Overlay điều khiển -->
        <div class="preview-controls">
            <div><span>⛶</span></div>
            <div><span class="play-btn" onclick="alert('Chức năng Play/Pause toàn hệ thống đang phát triển')">▶</span></div>
            <div><span style="font-size: 20px;">↺</span> <span style="font-size: 20px;">↻</span></div>
        </div>
    </main>

    <!-- 3. TIMELINE -->
    <section class="timeline-container">
        <div class="time-indicator">
            <span>00:00 / 00:03</span>
            <span style="color:#fff;">00:02</span>
        </div>
        
        <!-- Thanh công cụ trái của Timeline -->
        <div class="timeline-left-tools">
            <div class="tool-icon-btn" onclick="document.getElementById('fileInput').click()">
                <span style="font-size: 18px;">+</span>
                <span>Thêm</span>
            </div>
            <div class="tool-icon-btn" style="background: transparent; border: 1px dashed #444;">
                <span style="font-size: 18px;">✂️</span>
                <span>Cắt AI</span>
            </div>
        </div>

        <div class="timeline-tracks-wrapper">
            <div class="playhead" id="playhead"></div>
            
            <!-- Track Video -->
            <div class="track-row" id="trackVideo">
                <!-- Nội dung track được render bằng JS -->
            </div>
            
            <!-- Track Audio -->
            <div class="track-row">
                <div class="track-block" onclick="document.getElementById('fileInput').click()">+ Thêm âm thanh</div>
            </div>
            
            <!-- Track Text -->
            <div class="track-row">
                <div class="track-block" onclick="alert('Tính năng thêm văn bản đang phát triển')">+ Thêm văn bản</div>
            </div>
        </div>
    </section>

    <!-- 4. BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="openEditPanel()">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            <span style="color: #fff;">Chỉnh sửa</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            <span>Âm thanh</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M5 4v3h5.5v12h3V7H19V4z"/></svg>
            <span>Văn bản</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9h-2V7h-2v5H6v2h2v5h2v-5h2v-2z"/></svg>
            <span>Hiệu ứng</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
            <span>Lớp phủ</span>
        </div>
    </nav>

    <!-- 5. EDIT PANEL (BOTTOM SHEET) -->
    <div class="edit-panel" id="editPanel">
        <div class="panel-header">
            <span class="panel-close" onclick="closeEditPanel()">✕</span>
            <span class="panel-title">Chỉnh sửa Layer</span>
            <span style="width: 20px;"></span> <!-- Spacer -->
        </div>
        <div class="panel-content" id="editContent" style="opacity: 0.5; pointer-events: none;">
            <div class="slider-group">
                <div class="slider-header"><span>Kích thước</span><span id="valScale">1.0x</span></div>
                <input type="range" id="inputScale" min="0.1" max="3" step="0.1" value="1">
            </div>
            <div class="slider-group">
                <div class="slider-header"><span>Xoay 2D</span><span id="valRot2D">0°</span></div>
                <input type="range" id="inputRot2D" min="-180" max="180" value="0">
            </div>
            <div class="slider-group">
                <div class="slider-header"><span>Xoay 3D (Y)</span><span id="valRot3DY">0°</span></div>
                <input type="range" id="inputRot3DY" min="-180" max="180" value="0">
            </div>
            <div class="slider-group">
                <div class="slider-header"><span>Xoay 3D (X)</span><span id="valRot3DX">0°</span></div>
                <input type="range" id="inputRot3DX" min="-180" max="180" value="0">
            </div>
            <div class="slider-group full-width">
                <div class="slider-header"><span>Đồ thị chuyển động</span></div>
                <select id="selectGraph" style="padding: 8px; background: #333; color: white; border: 1px solid #444; border-radius: 5px;">
                    <option value="linear">Đều (Linear)</option>
                    <option value="easeOut">Hình khối phóng ra (Ease-out)</option>
                    <option value="easeInOut">Hình khối chữ S (S-Curve)</option>
                </select>
            </div>
            <div class="slider-group full-width" style="flex-direction: row; gap: 10px; margin-top: 10px;">
                <button class="btn-export" style="flex:1; padding: 12px; background:#444; color:#fff;" onclick="playAnimation()">▶ CHẠY THỬ</button>
                <button class="btn-export" style="flex:1; padding: 12px; background:#ff3b30; color:#fff;" onclick="removeLayer()">XÓA LỚP</button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" multiple accept="video/*,image/*">

    <script>
        // --- LOGIC HOẠT ĐỘNG (Giữ nguyên từ bản trước) ---
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('fileInput');
        const emptyState = document.getElementById('emptyState');
        const trackVideo = document.getElementById('trackVideo');
        const editPanel = document.getElementById('editPanel');
        const editContent = document.getElementById('editContent');
        
        let layers = []; 
        let activeLayerId = null;

        const inputs = {
            scale: document.getElementById('inputScale'),
            rot2D: document.getElementById('inputRot2D'),
            rot3DY: document.getElementById('inputRot3DY'),
            rot3DX: document.getElementById('inputRot3DX'),
            graph: document.getElementById('selectGraph')
        };

        // 1. Upload File
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (!file.type.startsWith('video/') && !file.type.startsWith('image/')) return;

                const url = URL.createObjectURL(file);
                const id = Date.now() + Math.random().toString(36).substr(2, 5);
                
                let type = file.type.startsWith('video/') ? 'video' : 'image';
                let element = type === 'video' ? document.createElement('video') : new Image();
                
                element.src = url;
                if (type === 'video') {
                    element.crossOrigin = 'anonymous';
                    element.loop = true;
                    element.muted = true;
                    element.play();
                }

                layers.push({ id, name: file.name, type, element, scale: 1, rot2D: 0, rot3DY: 0, rot3DX: 0, x: 0, y: 0, graph: 'linear' });
            });
            
            emptyState.style.display = 'none';
            document.getElementById('btnExport').disabled = false;
            renderTimeline(); 
            selectLayer(layers[layers.length - 1].id); // Chọn file mới nhất
            fileInput.value = '';
        });

        // 2. Render Timeline
        function renderTimeline() {
            trackVideo.innerHTML = '';
            layers.forEach(layer => {
                const div = document.createElement('div');
                div.className = `track-block video-active`;
                div.innerHTML = `<span>🎬 ${layer.name}</span>`;
                div.onclick = () => selectLayer(layer.id);
                trackVideo.appendChild(div);
            });
        }

        // 3. Chọn Layer & Mở Panel
        function selectLayer(id) {
            activeLayerId = id;
            const layer = layers.find(l => l.id === id);
            if (!layer) return;

            // Cập nhật UI thanh trượt
            inputs.scale.value = layer.scale;
            inputs.rot2D.value = layer.rot2D;
            inputs.rot3DY.value = layer.rot3DY;
            inputs.rot3DX.value = layer.rot3DX;
            inputs.graph.value = layer.graph;
            updateLabels();
            
            openEditPanel();
        }

        function openEditPanel() {
            if(!activeLayerId) return;
            editPanel.classList.add('open');
            editContent.style.opacity = '1';
            editContent.style.pointerEvents = 'auto';
        }

        function closeEditPanel() {
            editPanel.classList.remove('open');
        }

        function removeLayer() {
            if (!activeLayerId) return;
            layers = layers.filter(l => l.id !== activeLayerId);
            activeLayerId = null;
            renderTimeline();
            closeEditPanel();
            if (layers.length === 0) {
                emptyState.style.display = 'block';
                document.getElementById('btnExport').disabled = true;
            }
            drawFrame();
        }

        // 4. Lắng nghe sự kiện Slider
        Object.keys(inputs).forEach(key => {
            inputs[key].addEventListener('input', () => {
                if (!activeLayerId) return;
                const layer = layers.find(l => l.id === activeLayerId);
                
                if (key === 'scale') layer.scale = parseFloat(inputs.scale.value);
                if (key === 'rot2D') layer.rot2D = parseFloat(inputs.rot2D.value);
                if (key === 'rot3DY') layer.rot3DY = parseFloat(inputs.rot3DY.value);
                if (key === 'rot3DX') layer.rot3DX = parseFloat(inputs.rot3DX.value);
                if (key === 'graph') layer.graph = inputs.graph.value;
                updateLabels();
            });
        });

        function updateLabels() {
            document.getElementById('valScale').innerText = inputs.scale.value + 'x';
            document.getElementById('valRot2D').innerText = inputs.rot2D.value + '°';
            document.getElementById('valRot3DY').innerText = inputs.rot3DY.value + '°';
            document.getElementById('valRot3DX').innerText = inputs.rot3DX.value + '°';
        }

        // 5. Render Canvas (Fake 3D)
        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            layers.forEach(layer => {
                const el = layer.element;
                if ((layer.type === 'image' && !el.complete) || (layer.type === 'video' && el.readyState < 2)) return;

                ctx.save();
                ctx.translate(canvas.width / 2 + layer.x, canvas.height / 2 + layer.y);

                let radY = (layer.rot3DY * Math.PI) / 180;
                let radX = (layer.rot3DX * Math.PI) / 180;
                let fakeScaleX = Math.cos(radY);
                let fakeScaleY = Math.cos(radX);

                ctx.rotate((layer.rot2D * Math.PI) / 180);
                ctx.scale(layer.scale * fakeScaleX, layer.scale * fakeScaleY);

                const w = el.videoWidth || el.width || 400;
                const h = el.videoHeight || el.height || 400;
                
                const maxSize = 600;
                let drawW = w, drawH = h;
                if (w > maxSize || h > maxSize) {
                    const ratio = Math.min(maxSize / w, maxSize / h);
                    drawW = w * ratio;
                    drawH = h * ratio;
                }
                ctx.drawImage(el, -drawW / 2, -drawH / 2, drawW, drawH);
                ctx.restore();
            });
            requestAnimationFrame(drawFrame);
        }
        drawFrame();

        // 6. Đồ thị và Animation
        function getEasedProgress(p, type) {
            if (type === 'linear') return p;
            if (type === 'easeOut') return 1 - Math.pow(1 - p, 3);
            if (type === 'easeInOut') return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
            return p;
        }

        function playAnimation() {
            if (!activeLayerId) return;
            const layer = layers.find(l => l.id === activeLayerId);
            
            const duration = 3000; 
            const startTime = performance.now();
            const startRot = layer.rot3DY;
            const playhead = document.getElementById('playhead');

            function animateStep(currentTime) {
                let progress = Math.min((currentTime - startTime) / duration, 1);
                playhead.style.left = (progress * 100) + '%';

                let eased = getEasedProgress(progress, layer.graph);
                layer.rot3DY = startRot + (eased * 360);

                inputs.rot3DY.value = layer.rot3DY % 360;
                document.getElementById('valRot3DY').innerText = Math.round(layer.rot3DY % 360) + '°';

                if (progress < 1) requestAnimationFrame(animateStep);
                else setTimeout(() => playhead.style.left = '50%', 500);
            }
            requestAnimationFrame(animateStep);
        }

        // 7. Export Video
        function exportVideo() {
            if (layers.length === 0) return;
            const btn = document.getElementById('btnExport');
            btn.innerText = "Rendering...";
            btn.disabled = true;

            layers.forEach(l => { if(l.type === 'video') l.element.currentTime = 0; });

            const stream = canvas.captureStream(30);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            const chunks = [];

            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'capcut_clone_export.webm'; a.click();
                btn.innerText = "Xuất"; btn.disabled = false;
            };

            recorder.start();
            const duration = 3000;
            const startTime = performance.now();
            const initialStates = layers.map(l => ({ id: l.id, rot3DY: l.rot3DY }));

            function renderExportStep(currentTime) {
                let progress = Math.min((currentTime - startTime) / duration, 1);
                
                layers.forEach(layer => {
                    const initState = initialStates.find(s => s.id === layer.id);
                    if (initState) layer.rot3DY = initState.rot3DY + (getEasedProgress(progress, layer.graph) * 360);
                });

                if (progress < 1) requestAnimationFrame(renderExportStep);
                else {
                    recorder.stop();
                    initialStates.forEach(state => {
                        const l = layers.find(l => l.id === state.id);
                        if (l) l.rot3DY = state.rot3DY;
                    });
                }
            }
            requestAnimationFrame(renderExportStep);
        }
    </script>
</body>
</html>
